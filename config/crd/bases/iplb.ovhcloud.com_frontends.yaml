---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: frontends.iplb.ovhcloud.com
spec:
  group: iplb.ovhcloud.com
  names:
    kind: Frontend
    listKind: FrontendList
    plural: frontends
    singular: frontend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceRef.serviceName
      name: Service
      type: string
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .spec.port
      name: Port
      type: string
    - jsonPath: .status.frontendId
      name: FrontendID
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Frontend is the Schema for the frontends API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Frontend
            properties:
              allowedSource:
                description: allowedSource restricts inbound traffic to the given
                  CIDRs (allow-list).
                items:
                  type: string
                type: array
              defaultCertificateRef:
                description: |-
                  defaultCertificateRef references a Certificate custom resource in the same
                  namespace whose uploaded SSL certificate is served as the frontend's
                  default. Mutually exclusive with defaultSslId. Setting either enables ssl.
                type: string
              defaultFarmId:
                description: |-
                  defaultFarmId sets the default farm by its raw OVHcloud numeric id.
                  Mutually exclusive with defaultFarmRef.
                format: int64
                type: integer
              defaultFarmRef:
                description: |-
                  defaultFarmRef references a Farm custom resource in the same namespace
                  whose status.farmId is used as this frontend's default farm. Mutually
                  exclusive with defaultFarmId.
                type: string
              defaultSslId:
                description: |-
                  defaultSslId sets the default certificate by its raw OVHcloud SSL id.
                  Mutually exclusive with defaultCertificateRef.
                format: int64
                type: integer
              deniedSource:
                description: |-
                  deniedSource blocks inbound traffic from the given CIDRs (deny-list). Not
                  valid for udp frontends.
                items:
                  type: string
                type: array
              disabled:
                description: disabled disables the frontend without deleting it.
                type: boolean
              displayName:
                description: |-
                  displayName is the human-readable name of the frontend. Used to adopt a
                  pre-existing frontend with the same name. Defaults to the resource name.
                type: string
              forceSni:
                description: |-
                  forceSni blocks SSL connections that do not send an SNI. Only valid for
                  http frontends.
                type: boolean
              hsts:
                description: hsts enables HTTP Strict Transport Security. Only valid
                  for http frontends.
                type: boolean
              port:
                description: port is the listening port specification, e.g. "80",
                  "80,443" or "8080-8090".
                type: string
              protocol:
                description: |-
                  protocol is the frontend protocol. It must match the protocol of the
                  default farm it targets. TLS and HTTP routes are only valid for http
                  frontends; UDP frontends support neither TLS nor allowedSource.
                enum:
                - http
                - tcp
                - udp
                type: string
              redirectLocation:
                description: |-
                  redirectLocation is an HTTP redirection target (e.g. "https://www.ovh.com").
                  Only valid for http frontends.
                type: string
              routes:
                description: |-
                  routes are HTTP routes attached to this frontend, each running an action
                  when its rules match. Only valid for http frontends.
                items:
                  description: |-
                    Route is an HTTP route attached to a Frontend: an action triggered when all
                    of its rules match. Only valid for http frontends.
                  properties:
                    action:
                      description: action is triggered when every rule matches.
                      properties:
                        status:
                          description: status is the HTTP status code for "redirect"
                            and "reject" actions.
                          type: integer
                        target:
                          description: |-
                            target is the raw farm id (for "farm") or a URL template (for "redirect").
                            For a "farm" action prefer targetFarmRef.
                          type: string
                        targetFarmRef:
                          description: |-
                            targetFarmRef references a Farm custom resource in the same namespace whose
                            farmId is the target of a "farm" action. Mutually exclusive with target.
                          type: string
                        type:
                          description: type is the action to trigger.
                          enum:
                          - farm
                          - redirect
                          - reject
                          type: string
                      required:
                      - type
                      type: object
                    name:
                      description: name identifies the route within the frontend (used
                        as its display name).
                      type: string
                    rules:
                      description: rules are ANDed together to trigger the action.
                        An empty list matches all.
                      items:
                        description: RouteRule is a single match condition of a Route.
                        properties:
                          field:
                            description: field is the field to match, e.g. "host",
                              "path" or "header".
                            type: string
                          match:
                            description: match is the matching operator.
                            enum:
                            - contains
                            - endswith
                            - exists
                            - in
                            - internal
                            - is
                            - matches
                            - startswith
                            type: string
                          negate:
                            description: negate inverts the matching operator.
                            type: boolean
                          pattern:
                            description: pattern is the value matched against; its
                              interpretation depends on match.
                            type: string
                          subField:
                            description: subField is the sub-field when applicable,
                              e.g. a header or cookie name.
                            type: string
                        required:
                        - field
                        - match
                        type: object
                      type: array
                    weight:
                      description: weight is the route priority (0-255, highest wins).
                      maximum: 255
                      minimum: 0
                      type: integer
                  required:
                  - action
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              serviceRef:
                description: serviceRef selects the IPLB service and credentials.
                properties:
                  credentialsSecretRef:
                    description: |-
                      credentialsSecretRef references a Secret holding the OAuth2 client
                      credentials. The Secret must contain the keys "clientID" and
                      "clientSecret".
                    properties:
                      name:
                        description: name is the name of the Secret.
                        type: string
                      namespace:
                        description: |-
                          namespace is the namespace of the Secret. Defaults to the resource's
                          namespace when empty.
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    default: ovh-eu
                    description: endpoint is the go-ovh API endpoint to target.
                    enum:
                    - ovh-eu
                    - ovh-ca
                    - ovh-us
                    type: string
                  serviceName:
                    description: serviceName is the IPLB service identifier, e.g.
                      "loadbalancer-xxxxxxxx".
                    type: string
                required:
                - credentialsSecretRef
                - serviceName
                type: object
              ssl:
                description: |-
                  ssl enables TLS termination (SSL deciphering) on this frontend. Implied
                  when a default certificate is set. Only valid for http frontends.
                type: boolean
              zone:
                description: zone is the balancing zone the frontend lives in (e.g.
                  "gra", "all").
                type: string
            required:
            - port
            - protocol
            - serviceRef
            type: object
          status:
            description: status defines the observed state of Frontend
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Frontend resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              frontendId:
                description: frontendId is the numeric identifier assigned by the
                  OVHcloud API.
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              resolvedFarmId:
                description: resolvedFarmId is the default farm id resolved from spec
                  (ref or raw).
                format: int64
                type: integer
              resolvedSslId:
                description: resolvedSslId is the default SSL id resolved from spec
                  (cert ref or raw).
                format: int64
                type: integer
              routeIDs:
                additionalProperties:
                  format: int64
                  type: integer
                description: routeIDs maps each route name to its numeric id in the
                  OVHcloud API.
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
