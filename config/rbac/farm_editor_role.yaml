# This rule is not used by the project iplb-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the iplb.ovhcloud.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: iplb-operator
    app.kubernetes.io/managed-by: kustomize
  name: farm-editor-role
rules:
- apiGroups:
  - iplb.ovhcloud.com
  resources:
  - farms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - iplb.ovhcloud.com
  resources:
  - farms/status
  verbs:
  - get
