---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - iplb.ovhcloud.com
  resources:
  - certificates
  - farms
  - frontends
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - iplb.ovhcloud.com
  resources:
  - certificates/finalizers
  - farms/finalizers
  - frontends/finalizers
  verbs:
  - update
- apiGroups:
  - iplb.ovhcloud.com
  resources:
  - certificates/status
  - farms/status
  - frontends/status
  verbs:
  - get
  - patch
  - update
