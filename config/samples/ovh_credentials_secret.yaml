# OAuth2 client credentials for the OVHcloud API.
#
# Create an OAuth2 client at https://www.ovh.com/manager (or via the API) and
# grant it access to GET/POST/PUT/DELETE on /ipLoadbalancing/*. Then fill in the
# values below (stringData is base64-encoded for you by Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: ovh-credentials
type: Opaque
stringData:
  clientID: "<your-oauth2-client-id>"
  clientSecret: "<your-oauth2-client-secret>"
